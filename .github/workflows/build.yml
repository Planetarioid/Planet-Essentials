name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned Planet Lib submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Verify pinned Planet Lib checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f Planet-Lib/settings.gradle
          test -f Planet-Lib/src/main/resources/fabric.mod.json
          echo "Planet Lib submodule commit: $(git -C Planet-Lib rev-parse HEAD)"

      - name: Build and test
        run: gradle clean build

      - name: Verify distributable mod JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$jar_file"
          jar tf "$jar_file" | grep -qx 'fabric.mod.json'
          jar tf "$jar_file" | grep -qx 'com/planetstudios/essentials/PlanetEssentials.class'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: planet-essentials-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
          if-no-files-found: error
          retention-days: 14
